# compose.azure.yaml — the Azure hub topology, mirroring the LIVE
# VM shape: buckle + engine (litellm, engine-held seats) + health
# sidecar + GUI + repoagent worker. NO key material in this file —
# the engine's PAT rides the 0600 .env (COPILOT_API_KEY,
# ENGINE_MASTER_KEY, GITHUB_COPILOT_TOKEN_DIR); principal keys are
# minted into the shared /state volume by the one-shot `mint`
# profile; the over layer lives at /state/over.json5 (the file
# /admin/hubs lands edits through).
# deploy/engine/mscopilot.litellm.yaml is GENERATED — regenerate:
#   MSCOPPILOT_KEY_PATH=~/.claude/local-llm/copilot.key REAL_PROVIDERS=mscopilot \\
#     ENGINE_HELD_SEATS=mscopilot REAL_OUT=deploy/engine \\
#     bun tools/src/buckle.gen-engine-config.ts --real
# WIRING ONLY — all buckle config lives in settings/azure.settings.json5.
services:
  buckle:
    build: ..
    environment:
      BUCKLE_SETTINGS: /etc/buckle/settings.json5
      BUCKLE_DEFAULTS: /etc/buckle/default.settings.json5
      BUCKLE_SETTINGS_OVER: /state/over.json5
    volumes:
      - ./settings/default.settings.json5:/etc/buckle/default.settings.json5:ro
      - ./settings/azure.settings.json5:/etc/buckle/settings.json5:ro
      - state:/state
    ports:
      - "4111:4111"
    depends_on: [engine]

  # the engine leg — litellm holding the seat credentials (the
  # PAT never crosses into buckle or the worker; they auth as
  # principals and the engine spends the PAT for them)
  engine:
    # litellm v1.103.0
    image: ghcr.io/berriai/litellm@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
    command: ["--config", "/etc/engine/mscopilot.litellm.yaml", "--port", "4000"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./engine/mscopilot.litellm.yaml:/etc/engine/mscopilot.litellm.yaml:ro
      # pre-seeded github_copilot token cache (device flow never fires)
      - ./engine/tokens:/etc/engine/tokens
    ports:
      - "4000:4000"

  # the outside-process health verdict (never the served process)
  health:
    build: https://github.com/klh/fleet-health.git#v1.0.0
    environment:
      HEALTH_SETTINGS: /etc/health/settings.json5
    volumes:
      - ./settings/azure.health.settings.json5:/etc/health/settings.json5:ro
    ports:
      - "4112:4112"
    depends_on: [buckle]

  # the minimal GUI — static shell + /api seam (rides the GUI
  # principal key from /state/keys, read per request). Set
  # OIDC_ISSUER + OIDC_CLIENT_ID (deploy-time .env) to put the seam
  # behind the device-code front door — unset = open ops face.
  gui:
    build: ./gui
    environment:
      BUCKLE_URL: http://buckle:4111
      GUI_KEY_FILE: /state/keys/principal.gui@azure.key
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      SESSION_KEY_FILE: /state/keys/session.key
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - state:/state:ro
    ports:
      - "8080:8080"
    depends_on: [buckle]

  # ONE-SHOT bootstrap (profile `mint`): mints the declared
  # principals' 0600 key files into /state/keys. Idempotent — run it
  # once per hub:  docker compose --profile mint run --rm mint
  mint:
    profiles: ["mint"]
    build: ..
    entrypoint:
      ["bun", "/app/tools/src/buckle.azure-mint.ts", "/state/keys"]
    volumes:
      - ./settings/default.settings.json5:/etc/buckle/default.settings.json5:ro
      - ./settings/azure.settings.json5:/etc/buckle/settings.json5:ro
      - state:/state

  # the repoagent worker — picks its model at boot from the seed
  # dir (/.prefer hub=ikea + provider=mscopilot + frontier ladder,
  # hubs.json label→URL map, persona.md + template.md). The buckle
  # key is the MINTED worker@azure principal key (the PAT stays
  # engine-side ONLY, in the 0600 .env); worker_token is the GitHub
  # API leg. Durable journal: /state/worker.sqlite (survives
  # restarts; sweeps resume mid-cycle).
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/klh/fleet-worker:latest}
    restart: on-failure
    environment:
      WORKER_REPO: ${WORKER_REPO:-icomdev/Vanilla-JavaScript-Calculator}
      WORKER_GH_URL: https://api.github.com
      WORKER_TOKEN_FILE: /run/secrets/worker_token
      BUCKLE_URL: http://buckle:4111
      BUCKLE_KEY_FILE: /run/secrets/buckle_key
      WORKER_LANE: b3-repoagent-v1-calculon
      WORKER_STORE: /state/worker.sqlite
      WORKER_POLL_SECONDS: "20"
      WORKER_BYOC: "false"
    volumes:
      - ./secrets/worker_token:/run/secrets/worker_token:ro
      - ./secrets/buckle_key:/run/secrets/buckle_key:ro
      - ./worker:/etc/worker:ro
      - state:/state
    depends_on: [buckle]

volumes:
  state:
