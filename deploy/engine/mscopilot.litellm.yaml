general_settings:
  master_key: os.environ/ENGINE_MASTER_KEY
  pass_through_endpoints:
# GENERATED for the BYOC seat mscopilot — never hand-edited.
# Pass-through seam: the caller's token IS the credential — litellm
# forwards the incoming Authorization verbatim (forward_headers),
# registry catalog_headers ride static config. Buckle's userleg
# calls /v1/byoc/mscopilot/<subpath>. Seat route rows come
# first (byoc_routes in the registry — the live seat is not
# path-uniform); the catch-all forwards everything else verbatim.
    - path: "/v1/byoc/mscopilot/v1/chat/completions"
      target: "https://api.githubcopilot.com/chat/completions"
      forward_headers: true
      headers:
        "copilot-integration-id": "vscode-chat"
    - path: "/v1/byoc/mscopilot/v1/messages"
      target: "https://api.githubcopilot.com/v1/messages"
      forward_headers: true
      headers:
        "copilot-integration-id": "vscode-chat"
    - path: "/v1/byoc/mscopilot/v1/responses"
      target: "https://api.githubcopilot.com/responses"
      forward_headers: true
      headers:
        "copilot-integration-id": "vscode-chat"
    - path: "/v1/byoc/mscopilot"
      target: "https://api.githubcopilot.com"
      include_subpath: true
      forward_headers: true
      headers:
        "copilot-integration-id": "vscode-chat"
